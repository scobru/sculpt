name: Build Audio Plugins (VST3, AU, AAX, CLAP, Standalone)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      tag_name:
        description: 'Tag name for release (optional, e.g. v1.1.8)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: Build macOS (Universal arm64 + x86_64)
    runs-on: macos-14
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build
          cd ..

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="10.15"

      - name: Build Plugins
        run: |
          cmake --build build --config Release --parallel

      - name: Package macOS Artifacts
        run: |
          mkdir -p artifacts/macOS
          cd build/plugin/Sculpt_artefacts/Release
          
          if [ -d "AU/Sculpt.component" ]; then
            cp -R "AU/Sculpt.component" ../../../../artifacts/macOS/
          fi
          if [ -d "VST3/Sculpt.vst3" ]; then
            cp -R "VST3/Sculpt.vst3" ../../../../artifacts/macOS/
          fi
          if [ -d "Standalone/Sculpt.app" ]; then
            cp -R "Standalone/Sculpt.app" ../../../../artifacts/macOS/
          fi
          if [ -d "CLAP/Sculpt.clap" ] || [ -f "CLAP/Sculpt.clap" ]; then
            cp -R "CLAP/Sculpt.clap" ../../../../artifacts/macOS/
          fi
          if [ -d "AAX/Sculpt.aaxplugin" ]; then
            cp -R "AAX/Sculpt.aaxplugin" ../../../../artifacts/macOS/
          fi
          
          cd ../../../../artifacts
          cp ../README.md macOS/ || true
          cp ../LICENSE macOS/ || true
          if [ -f "../install.command" ]; then
            cp ../install.command macOS/
            chmod +x macOS/install.command
          fi
          zip -r -y Sculpt-macOS-Universal.zip macOS/

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sculpt-macOS
          path: artifacts/Sculpt-macOS-Universal.zip
          retention-days: 30

  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout code with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build WebUI
        run: |
          cd webui
          npm install
          npm run build
          cd ..

      - name: Install WebView2 NuGet Package
        shell: pwsh
        run: |
          $targetDir = "$env:USERPROFILE\AppData\Local\PackageManagement\NuGet\Packages\Microsoft.Web.WebView2.1.0.3485.44"
          New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
          $zip = "$env:TEMP\webview2.zip"
          curl.exe -L -o $zip "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.3485.44"
          tar -xf $zip -C $targetDir

      - name: Configure CMake
        run: |
          cmake -B build -A x64

      - name: Build Plugins
        shell: pwsh
        run: |
          $targets = @("Sculpt_VST3", "Sculpt_Standalone", "Sculpt_CLAP")
          if (Test-Path "aax-sdk\Interfaces\AAX.h") {
            $targets += "Sculpt_AAX"
          }
          cmake --build build --config Release --target $targets --parallel

      - name: Package Windows Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts\Windows | Out-Null
          
          # VST3 bundle
          if (Test-Path "build\plugin\Sculpt_artefacts\Release\VST3\Sculpt.vst3") {
            Copy-Item -Recurse "build\plugin\Sculpt_artefacts\Release\VST3\Sculpt.vst3" "artifacts\Windows\"
          }
          
          # Standalone .exe
          if (Test-Path "build\plugin\Sculpt_artefacts\Release\Standalone\Sculpt.exe") {
            Copy-Item "build\plugin\Sculpt_artefacts\Release\Standalone\Sculpt.exe" "artifacts\Windows\"
          }
          
          # CLAP plugin
          if (Test-Path "build\plugin\Sculpt_artefacts\Release\CLAP\Sculpt.clap") {
            Copy-Item "build\plugin\Sculpt_artefacts\Release\CLAP\Sculpt.clap" "artifacts\Windows\"
          }
          
          # AAX bundle (Pro Tools)
          if (Test-Path "build\plugin\Sculpt_artefacts\Release\AAX\Sculpt.aaxplugin") {
            Copy-Item -Recurse "build\plugin\Sculpt_artefacts\Release\AAX\Sculpt.aaxplugin" "artifacts\Windows\"
          }
          
          # Scripts & Documentation
          if (Test-Path "install.bat") { Copy-Item "install.bat" "artifacts\Windows\" }
          if (Test-Path "README.md") { Copy-Item "README.md" "artifacts\Windows\" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "artifacts\Windows\" }
          
          Compress-Archive -Path artifacts\Windows\* -DestinationPath artifacts\Sculpt-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sculpt-Windows
          path: artifacts/Sculpt-Windows-x64.zip
          retention-days: 30

  release:
    name: Create GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    needs: [ build-macos, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Sculpt-macOS
          path: release-assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Sculpt-Windows
          path: release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ (inputs.tag_name != '' && inputs.tag_name) || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
